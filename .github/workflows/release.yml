name: Release

# Push a tag like v0.1.0 (or v0.1.0-beta.1 for a pre-release) to build and publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  VPK_VERSION: 1.2.161

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  windows:
    needs: ci
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then echo "PRE=--pre" >> "$GITHUB_ENV"; fi

      - name: Publish
        run: |
          dotnet publish SharpSelecta.App -c Release -r win-x64 -p:Version="$VERSION" -o publish | tee publish.log
          if grep -oE "Assembly '[^']+' produced" publish.log | grep -vE "'(Avalonia\.Controls\.DataGrid|FFMpegCore)'"; then exit 1; fi
          mkdir symbols && mv publish/*.pdb symbols/

      - run: dotnet tool install -g vpk --version "$VPK_VERSION"

      # The previous release lets vpk build a delta package, so updates download only what changed.
      # --pre: the newest release of any kind, so 1.0.0 gets a delta from the last rc too.
      - name: Previous release
        continue-on-error: true
        run: vpk download github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --pre -o releases

      # Builds the one-click Setup.exe, the MSI (a wizard: license, then just for me or for everyone)
      # and the portable zip (SharpSelecta.exe on top, the app's files in current\).
      # The MSI's license page takes only .txt, .md or .rtf files, and its version only x.x.x.x
      # (1.0.0-rc.2 becomes 1.0.0.0; updates go by the package version, not this one).
      - name: Installers
        run: |
          cp LICENSE LICENSE.txt
          vpk pack --packId SharpSelecta --packVersion "$VERSION" --packDir publish \
            --mainExe SharpSelecta.exe --packTitle SharpSelecta --packAuthors ghorshy \
            --icon SharpSelecta.App/Assets/sharpselecta.ico \
            --msi --msiVersion "${VERSION%%-*}.0" --instLicense LICENSE.txt \
            --runtime win-x64 -o releases

      - name: Create the release
        run: >
          vpk upload github --repoUrl "https://github.com/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}"
          -o releases --publish $PRE --tag "$GITHUB_REF_NAME" --releaseName "SharpSelecta $VERSION"

      # vpk upload may leave the MSI out of the release.
      - name: Attach the MSI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | grep -q '\.msi$'; then
            gh release upload "$GITHUB_REF_NAME" releases/*.msi
          fi

      - name: Attach the debug symbols
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          7z a "SharpSelecta-$VERSION-win-x64-symbols.zip" ./symbols/*
          gh release upload "$GITHUB_REF_NAME" "SharpSelecta-$VERSION-win-x64-symbols.zip"

  linux:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: NativeAOT toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # One self-contained build; the tarball, .deb, .rpm and AppImage are all made from it.
      - name: Publish
        run: |
          set -o pipefail
          dotnet publish SharpSelecta.App -c Release -r linux-x64 -p:Version="$VERSION" -o build/linux-x64/app | tee publish.log
          if grep -oE "Assembly '[^']+' produced" publish.log | grep -vE "'(Avalonia\.Controls\.DataGrid|FFMpegCore)'"; then exit 1; fi
          mv build/linux-x64/app/SharpSelecta build/linux-x64/app/sharpselecta
          mkdir -p symbols dist
          mv build/linux-x64/app/*.dbg build/linux-x64/app/*.pdb symbols/
          tar czf "dist/SharpSelecta-$VERSION-linux-x64-symbols.tar.gz" -C symbols .

      - name: Tarball
        run: |
          dir="SharpSelecta-$VERSION-linux-x64"
          mkdir -p dist
          cp -a build/linux-x64/app "$dir"
          cp packaging/linux/io.github.ghorshy.SharpSelecta.desktop packaging/linux/install.sh packaging/linux/uninstall.sh "$dir/"
          cp SharpSelecta.App/Assets/Icons/sharpselecta-logo.svg "$dir/io.github.ghorshy.SharpSelecta.svg"
          chmod +x "$dir/install.sh" "$dir/uninstall.sh"
          tar czf "dist/$dir.tar.gz" "$dir"

      - name: .deb and .rpm
        run: |
          for packager in deb rpm; do
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src -e VERSION="$VERSION" \
              goreleaser/nfpm:v2.43.0 package -f packaging/linux/nfpm.yaml -p "$packager" -t dist/
          done

      # appimagetool refuses to run without desktop-file-validate.
      - name: AppImage tools
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils

      - name: AppImage
        env:
          APPIMAGETOOL_SHA256: 46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1
        run: |
          curl -sSfL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          id=io.github.ghorshy.SharpSelecta
          appdir=build/SharpSelecta.AppDir
          mkdir -p "$appdir/usr/lib" "$appdir/usr/share/applications" "$appdir/usr/share/metainfo" "$appdir/usr/share/icons/hicolor/scalable/apps"
          cp -a build/linux-x64/app "$appdir/usr/lib/sharpselecta"
          cp packaging/linux/AppRun "$appdir/AppRun"
          chmod +x "$appdir/AppRun"
          cp packaging/linux/$id.desktop "$appdir/"
          cp packaging/linux/$id.desktop "$appdir/usr/share/applications/"
          cp packaging/linux/$id.metainfo.xml "$appdir/usr/share/metainfo/"
          cp SharpSelecta.App/Assets/Icons/sharpselecta-logo.svg "$appdir/$id.svg"
          cp SharpSelecta.App/Assets/Icons/sharpselecta-logo.svg "$appdir/usr/share/icons/hicolor/scalable/apps/$id.svg"
          ln -s "$id.svg" "$appdir/.DirIcon"
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$appdir" "dist/SharpSelecta-$VERSION-x86_64.AppImage"

      - name: Attach the Linux builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*

  aur:
    needs: linux
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: PKGBUILD and .SRCINFO
        run: |
          mkdir aur-build
          sed -e "s/^pkgver=.*/pkgver=$VERSION/" -e "s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD > aur-build/PKGBUILD
          docker run --rm -v "$PWD/aur-build:/pkg" archlinux:base-devel bash -ec '
            pacman -Syu --noconfirm --needed pacman-contrib > /dev/null
            useradd -m builder
            chown -R builder /pkg
            su builder -c "cd /pkg && updpkgsums && makepkg --printsrcinfo > .SRCINFO"'

      - name: Push to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "::warning::AUR_SSH_KEY isn't set, the AUR package wasn't updated"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/sharpselecta-bin.git aur-repo
          cp aur-build/PKGBUILD aur-build/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "The AUR package is already at $VERSION"
            exit 0
          fi
          git commit -m "sharpselecta-bin $VERSION"
          git push origin HEAD:master
