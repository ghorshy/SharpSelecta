<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  SharpSelecta – wersja z wyrównanymi proporcjami
  Rozkład promieni (mm):
    rant (czarny)        108.5 → 102.5   (6)
    pole rowków 1        102.5 →  86.0   (16.5)
    rowek 1               86.0 →  83.5   (2.5)
    pole rowków 2         83.5 →  67.0   (16.5)
    rowek 2               67.0 →  64.5   (2.5)
    pole rowków 3         64.5 →  48.0   (16.5)
    pierścień przy labelu 48.0 →  36.0   (12)
    label                 36.0
-->

<svg
